="20" font-weight="bold" text-anchor="start" fill="#202020">13. 确认更新</text><text x="103" y="936" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">接受或修改建议</text><rect x="579" y="878" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="908" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">保存新计划并刷新日程</text><text x="593" y="936" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">显示提醒变化</text><rect x="1069" y="878" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="908" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">更新版本与调度</text><text x="1083" y="936" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">取消旧提醒，不重复发送</text><line x1="531" y1="928" x2="579" y2="928" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="928" x2="1069" y2="928" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="978" x2="1290" y2="1006" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="1010" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="1040" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">14. 继续使用与反馈</text><text x="103" y="1068" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">追问、纠错或归档</text><rect x="579" y="1010" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/