ns CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">用途、地区和失效兜底</text><rect x="1069" y="350" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="380" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">返回真实入口信息</text><text x="1083" y="408" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">不代预约或提交材料</text><line x1="531" y1="400" x2="579" y2="400" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="400" x2="1069" y2="400" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="450" x2="1290" y2="478" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">10. 选择提醒</text><text x="103" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">设置时间并单独授权</text><rect x="579" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">展示授权与发送状态</text><text x="593" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">未授权时保留站内待办</text><rect x="1069" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">安排提醒</text><text x="1083" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">按计划版本去重</text><line x1="531" y1="532" x2="579" y2="532" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="532" x2="1069" y2="532" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="582" x2="1290" y2="610" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">11. 反馈进度</text><text x="103" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">完成、等待、延期或跳过</text><rect x="579" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">记录实际状态</text><text x="593" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">不把打开网址当完成</text><rect x="1069" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">识别受影响任务</text><text x="1083" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">保留已完成记录</text><line x1="531" y1="664" x2="579" y2="664" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="664" x2="1069" y2="664" st