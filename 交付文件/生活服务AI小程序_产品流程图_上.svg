<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#222" stroke-width="1.8"/></marker></defs><text x="65" y="62" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="36" font-weight="bold" text-anchor="start" fill="#202020">4.2 产品流程图</text><text x="65" y="100" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#202020">生活服务 AI 小程序产品流程泳道图（1/2）：首次建档与计划生成</text><rect x="65" y="145" width="1470" height="1020" fill="white" stroke="#222" stroke-width="2"/><line x1="555" y1="145" x2="555" y2="1165" stroke="#222" stroke-width="2.4"/><line x1="1045" y1="145" x2="1045" y2="1165" stroke="#222" stroke-width="2.4"/><line x1="65" y1="195" x2="1535" y2="195" stroke="#222" stroke-width="2.4"/><text x="310.0" y="180" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#202020">用户</text><text x="800.0" y="180" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#202020">微信小程序</text><text x="1290.0" y="180" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#202020">规划服务与数据层</text><rect x="89" y="218" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="248" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">1. 开始搬迁规划</text><text x="103" y="276" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020