<rect x="1069" y="1010" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="1040" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">写入计划版本</text><text x="1083" y="1068" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">只保存用户确认的结果</text><line x1="531" y1="1060" x2="579" y2="1060" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="1060" x2="1069" y2="1060" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="105" y="1182" width="1390" height="44" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="9 7"/><text x="123" y="1211" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">泳道阅读方式：用户作出关键决定；小程序承接操作和展示；服务层依据经核验的数据计算和存储。</text></svg>