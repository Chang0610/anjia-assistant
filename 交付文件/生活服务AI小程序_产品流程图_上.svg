20">保存待确认画像</text><text x="1083" y="408" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">分离一次性与月度预算</text><line x1="531" y1="400" x2="579" y2="400" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="400" x2="1069" y2="400" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="450" x2="1290" y2="478" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">3. 确认目标和口径</text><text x="103" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">入职日、全流程目标日</text><text x="103" y="565" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">搬家费用范围</text><rect x="579" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">展示确认摘要</text><text x="593" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">指出矛盾与缺失</text><rect x="1069" y="482" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="512" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">换算期限和里程碑</text><text x="1083" y="540" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">N 天/周换算为目标完成日</text><line x1="531" y1="532" x2="579" y2="532" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="532" x2="1069" y2="532" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="582" x2="1290" y2="610" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">4. 按需补充</text><text x="103" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">办公地点、月租上限</text><text x="103" y="697" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">住处状态与特殊条件</text><rect x="579" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">只追问关键缺项</text><text x="593" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">每轮最多 3 个问题</text><rect x="1069" y="614" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="644" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">检索城市知识与数据</text><text x="1083" y="672" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">政策、区域、路线及费用</text><line x1="531" y1="664" x2="579" y2="664" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1021" y1="664" x2="1069" y2="664" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="714" x2="1290" y2="742" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="579" y="746" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593" y="776" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">显示生成状态</text><text x="593" y="804" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">保留输入，支持重试</text><rect x="1069" y="746" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="1083" y="776" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">5. 生成候选计划</text><text x="1083" y="804" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">匹配任务，建立依赖</text><text x="1083" y="829" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">倒推日期与优先级</text><line x1="1021" y1="796" x2="1069" y2="796" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1290" y1="846" x2="1290" y2="874" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="89" y="878" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="103" y="908" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#202020">6. 查看计划预览</text><text x="103" y="936" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#202020">检查任务、费用与日期</text><rect x="579" y="878" width="442" height="100" fill="white" stroke="#222" stroke-width="2"/><text x="593"